services:
  postgres:
    image: postgres:16-alpine
    container_name: hotspot-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotspot_monitor
    ports:
      - "5433:5432"
    volumes:
      - hotspot_monitor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hotspot_monitor_pgdata:
